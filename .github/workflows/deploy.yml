name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          update: true  # pre-installed PHP is otherwise left on an old patch
        with:
          php-version-file: .php-version
          extensions: mbstring, pdo, pdo_mysql
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging
        run: |
          rsync -azr --delete \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.github/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.HETZNER_SSH_USER }}@${{ secrets.HETZNER_SSH_HOST }}:/var/www/muzitheek.soli.nl/staging/

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.HETZNER_SSH_USER }}@${{ secrets.HETZNER_SSH_HOST }} bash -s << 'DEPLOY_SCRIPT'
          set -e

          APP_DIR=/var/www/muzitheek.soli.nl
          STAGING="$APP_DIR/staging"
          SHARED="$APP_DIR/shared"

          # Symlink shared .env and storage into staging
          ln -sfn "$SHARED/.env" "$STAGING/.env"
          ln -sfn "$SHARED/storage" "$STAGING/storage"

          # ---------------------------------------------------------------
          # Refuse to deploy onto a PHP older than .php-version.
          #
          # The pin is the patch production must run at least. Renovate
          # bumps it once a PHP release is three days old; the server is
          # patched by hand, so this is where a lagging server shows up.
          # A newer patch or minor passes. FPM is checked as well as the
          # CLI because FPM serves the site; the gate assumes the FPM of
          # the CLI's minor is the live one.
          # ---------------------------------------------------------------
          PATH="$PATH:/usr/sbin"
          PHP_PIN=$(tr -d '[:space:]' < "$STAGING/.php-version")
          CLI_PHP=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION;') || CLI_PHP=""
          FPM_MINOR=${CLI_PHP%.*}
          FPM_PHP=$("php-fpm$FPM_MINOR" -v 2>/dev/null \
            | sed -n '1s/^PHP \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p') || FPM_PHP=""
          PHP_PROBLEMS=""
          for pair in "cli:$CLI_PHP" "fpm:$FPM_PHP"; do
            SAPI=${pair%%:*}; VERSION=${pair#*:}
            if [ -z "$VERSION" ]; then
              PHP_PROBLEMS="$PHP_PROBLEMS  PHP $SAPI: not installed"$'\n'
            elif [ "$(printf '%s\n' "$PHP_PIN" "$VERSION" | sort -V | head -n1)" != "$PHP_PIN" ]; then
              PHP_PROBLEMS="$PHP_PROBLEMS  PHP $SAPI: $VERSION"$'\n'
            fi
          done
          if [ -n "$FPM_PHP" ] && ! systemctl is-active --quiet "php$FPM_MINOR-fpm"; then
            PHP_PROBLEMS="$PHP_PROBLEMS  service php$FPM_MINOR-fpm: not active"$'\n'
          fi
          if [ -n "$PHP_PROBLEMS" ]; then
            echo ".php-version requires PHP $PHP_PIN or newer. This server has:"
            printf '%s' "$PHP_PROBLEMS"
            echo "Upgrade PHP on the server (apt upgrade 'php$FPM_MINOR-*') and redeploy."
            echo "Refusing to deploy."
            exit 1
          fi
          echo "PHP $CLI_PHP (cli) / $FPM_PHP (fpm) satisfies .php-version $PHP_PIN"

          # Database backup before migrations (keep last 5)
          BACKUP_DIR="$SHARED/storage/backups"
          mkdir -p "$BACKUP_DIR"
          source "$SHARED/.env"
          BACKUP_FILE="$BACKUP_DIR/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
          mysqldump -h"${DB_HOST:-127.0.0.1}" -P"${DB_PORT:-3306}" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" | gzip > "$BACKUP_FILE"
          echo "Database backup saved to $BACKUP_FILE"
          ls -t "$BACKUP_DIR"/pre-deploy-*.sql.gz | tail -n +6 | xargs -r rm --
          chown www-data:www-data "$BACKUP_FILE" 2>/dev/null || true

          # Run migrations on staging (abort on failure)
          cd "$STAGING"
          if ! sudo -u www-data php artisan migrate --force; then
            echo "Migration failed — aborting deploy"
            rm -rf "$STAGING"
            exit 1
          fi

          # Atomic swap: save previous release, go live
          cd "$APP_DIR"
          if [ -d current ] && [ ! -L current ]; then
            rm -rf previous
            mv current previous
          fi
          mv "$STAGING" current

          # Fix bootstrap/cache ownership so www-data can write cached config
          cd current
          chgrp -R www-data bootstrap/cache
          chmod -R g+w bootstrap/cache

          # Clear application cache (e.g. cached translations) and warm framework caches
          sudo -u www-data php artisan cache:clear
          sudo -u www-data php artisan config:cache
          sudo -u www-data php artisan route:cache
          sudo -u www-data php artisan view:cache

          # Health check — rollback if site is broken
          sleep 2
          HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 10 https://muzitheek.soli.nl || echo "000")
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 500 ]; then
            echo "Health check failed (HTTP $HTTP_STATUS) — rolling back"
            cd "$APP_DIR"
            mv current failed
            mv previous current
            echo "Rollback complete. Failed release saved in $APP_DIR/failed"
            exit 1
          fi

          echo "Deploy complete (HTTP $HTTP_STATUS)"
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
